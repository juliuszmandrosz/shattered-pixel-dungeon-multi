<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>co-op harness</title>
<style>
  body { margin: 0; background: #000; color: #ccc; font: 12px monospace; }
  .row { display: flex; height: calc(100vh - 24px); }
  iframe { flex: 1; border: 0; border-right: 2px solid #333; }
  #bar { height: 24px; line-height: 24px; padding: 0 8px; background: #111; }
</style>
</head>
<body>
<div id="bar">co-op harness: one game instance per player in one page, actions relayed in order like the database would · <span id="count">0 actions</span> · <span id="turn"></span></div>
<div class="row" id="row"></div>
<script>
  // seed and party are shared, each frame gets its own player id; all see the same order.
  // ?party=WARRIOR,MAGE,ROGUE gives three players (one frame per class, up to four).
  const params = new URLSearchParams(location.search);
  const seed = params.get("seed") || String(Math.floor(Math.random() * 1e9));
  const party = params.get("party") || "WARRIOR,MAGE";
  const classes = party.split(",").slice(0, 4);
  const ids = ["A", "B", "C", "D"].slice(0, classes.length);
  const room = "harness-" + seed;
  const frames = {};
  for (const id of ids) {
    const frame = document.createElement("iframe");
    frame.id = id.toLowerCase();
    document.getElementById("row").appendChild(frame);
    frames[id] = frame;
  }
  ids.forEach((id, i) => {
    const q = new URLSearchParams({ room, player: id, order: ids.join(","), seed, party, heroClass: classes[i] });
    if (params.get("rngtrace")) q.set("rngtrace", "1");
    q.set("v", String(Date.now()));
    frames[id].src = (params.get("base") || "/game") + "/index.html?" + q.toString();
  });
  // the log of everything relayed so far; a frame that becomes ready later gets the whole log
  const log = [];
  const ready = {};
  // ?actions=A|cell|835;B|cell|713;... replays a recorded sequence (one action every 2.5s once
  // every frame is ready), to reproduce a desync seen in a real room
  const scripted = (params.get("actions") || "").split(";").filter(Boolean).map((a) => {
    const [uid, type, payload] = a.split("|");
    return { uid, type, payload };
  });
  let scriptTimer = null;
  function relay(uid, type, payload) {
    const msg = { spd: "action", id: String(log.length), uid, seq: log.length, type, payload, at: Date.now() };
    log.push(msg);
    for (const id of ids) if (ready[id]) frames[id].contentWindow.postMessage(msg, location.origin);
    document.getElementById("count").textContent = log.length + " messages";
  }
  window.relay = relay; // for scripted tests
  function maybeStartScript() {
    if (!scripted.length || scriptTimer || !ids.every((id) => ready[id])) return;
    scriptTimer = setInterval(() => {
      const next = scripted.shift();
      if (!next) { clearInterval(scriptTimer); return; }
      relay(next.uid, next.type, next.payload);
    }, 2500);
  }
  // the lobby page's turn policy (see PlayClient.tsx), once per frame: the owner writes
  // "nothing new" (skip hero:epoch) at once for its busy hero, or its idle hero while others
  // move with no enemy in sight; other frames after a delay; a strict turn only after a long
  // timeout. ?afk=A makes frame A absent (it never writes), to exercise the fallback.
  const AFK_MS = 700, AFK_STAGGER_MS = 300, SKIP_SECONDS_DANGER = 45;
  const absent = (params.get("afk") || "").split(",").filter(Boolean);
  const timers = {}, sent = {}, starts = {};
  function policy(uid, t) {
    if (timers[uid]) { clearTimeout(timers[uid]); timers[uid] = null; }
    if (absent.includes(uid)) return;
    const busy = (s) => s === "walk" || s === "rest";
    const myIndex = ids.indexOf(uid);
    const write = (hero, epoch) => { const key = hero + ":" + epoch; if (sent[uid] === key) return; sent[uid] = key; relay(uid, "skip", key); };
    const othersBusy = (hero) => t.states.some((s, i) => i !== hero && busy(s));
    const myEpoch = t.epochs ? t.epochs[myIndex] : null;
    if (myEpoch !== null && (busy(t.states[myIndex]) || (!t.danger && othersBusy(myIndex)))) write(myIndex, myEpoch);
    const key = t.hero + ":" + t.epoch;
    if (!starts[uid] || starts[uid].key !== key) starts[uid] = { key, at: Date.now() };
    const strict = !busy(t.states[t.hero]) && t.danger;
    let delay = null;
    if (t.hero !== myIndex) {
      if (!strict && (busy(t.states[t.hero]) || othersBusy(t.hero))) delay = AFK_MS + AFK_STAGGER_MS * ((myIndex - t.hero + ids.length) % ids.length);
      else if (strict) delay = SKIP_SECONDS_DANGER * 1000;
    }
    if (delay === null) return;
    timers[uid] = setTimeout(() => write(t.hero, t.epoch), Math.max(0, delay - (Date.now() - starts[uid].at)));
  }
  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d) return;
    const uid = ids.find((id) => e.source === frames[id].contentWindow);
    if (!uid) return;
    if (d.spd === "ready") {
      ready[uid] = true;
      for (const msg of log) frames[uid].contentWindow.postMessage(msg, location.origin);
      maybeStartScript();
      return;
    }
    if (d.spd === "turn") {
      window.lastTurn = window.lastTurn || {};
      window.lastTurn[uid] = d;
      document.getElementById("turn").textContent = ids.map((id) => {
        const t = window.lastTurn[id];
        return id + ": " + (t ? `hero ${t.hero} e${t.epoch} ${t.danger ? "COMBAT" : "explore"} ${t.waiting ? "wait" : "go"} [${t.states.join(",")}]` : "-");
      }).join("   ");
      policy(uid, d);
      return;
    }
    if (d.spd !== "action" || d.uid !== undefined) return; // only fresh actions from a game
    relay(uid, d.type, d.payload);
  });
</script>
</body>
</html>
