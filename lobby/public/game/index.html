<!DOCTYPE html>
<html>
    <head>
        <title>Shattered Pixel Dungeon</title>
        <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
        <style>
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                background: #000;
                height: 100vh;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
            #canvas {
                border: none;
            }
        </style>
    </head>
    <body oncontextmenu="return false">
        <div>
            <canvas id="canvas"></canvas>
        </div>
        <script>
            // client errors go to the hosting page (and from there into the room's log), so a
            // frozen client can be diagnosed from the database alone; a few per load is enough
            (function () {
                var sent = 0;
                function report(kind, text) {
                    if (sent++ >= 8 || window.parent === window) return;
                    try { window.parent.postMessage({ spd: "error", kind: kind, message: String(text).slice(0, 1500) }, location.origin); } catch (e) {}
                }
                window.addEventListener("error", function (e) { report("error", (e.message || "") + "\n" + (e.error && e.error.stack || "")); });
                window.addEventListener("unhandledrejection", function (e) { report("rejection", e.reason && (e.reason.stack || e.reason.message) || e.reason); });
                var consoleError = console.error.bind(console);
                console.error = function () {
                    try { report("console", Array.prototype.map.call(arguments, function (a) { return a && a.stack || String(a); }).join(" ")); } catch (e) {}
                    consoleError.apply(console, arguments);
                };
            })();
            async function start() {
                main(["4.0.2", "922"])
            }
            window.addEventListener("load", start);
        </script>
        <script type="text/javascript" charset="utf-8" src="app.js"></script>
    </body>
</html>
